# Checks the live site and database. GitHub emails the repository owner when a
# scheduled run fails (depending on their notification settings).
name: Uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site and database respond
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 https://code-alpha-cloud-bus-pass-system.vercel.app/api/health/db
